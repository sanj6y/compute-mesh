name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: make build

  proto-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-protoc@v3
        with:
          version: "34.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: regenerate
        run: make proto
      - name: check no drift
        run: git diff --exit-code -- proto/
