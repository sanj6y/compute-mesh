// inference.proto — coordinator/gateway → worker data plane and worker control.
//
// The gateway proxies Generate chunks to the client as SSE. On worker death
// the gateway re-dispatches with `prefix` set to the text already streamed,
// so the new worker continues rather than restarts (see docs/adr on failover).
syntax = "proto3";

package lcm.v1;

option go_package = "github.com/sanj6y/compute-mesh/proto/lcm/v1;lcmv1";

service InferenceService {
  // Generate streams tokens for a chat or completion request.
  rpc Generate(GenerateRequest) returns (stream GenerateChunk);

  // Embed returns one vector per input. Workers may receive batches the
  // gateway assembled from many client requests (dynamic batching).
  rpc Embed(EmbedRequest) returns (EmbedResponse);

  // LoadModel asks the worker to make a model resident (pre-warming).
  rpc LoadModel(LoadModelRequest) returns (LoadModelResponse);

  // UnloadModel evicts a model from VRAM.
  rpc UnloadModel(UnloadModelRequest) returns (UnloadModelResponse);

  // Drain stops the worker accepting new placements. In-flight requests finish.
  rpc Drain(DrainRequest) returns (DrainResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_USER = 2;
  ROLE_ASSISTANT = 3;
  ROLE_TOOL = 4;
}

message Message {
  Role role = 1;
  string content = 2;
}

message GenerateRequest {
  string request_id = 1;        // gateway-assigned; stable across failover
  string model = 2;

  // Exactly one of messages (chat) or prompt (raw completion) is set.
  repeated Message messages = 3;
  string prompt = 4;

  // prefix is text already generated by a previous worker for this request_id.
  // The worker must condition on prompt+prefix and emit only continuation.
  string prefix = 5;

  uint32 max_tokens = 6;        // remaining budget; gateway subtracts len(prefix)
  double temperature = 7;
  double top_p = 8;
  int64 seed = 9;               // set by gateway so failover decoding is as close as possible
  repeated string stop = 10;
}

enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1;       // model emitted EOS or a stop sequence
  FINISH_REASON_LENGTH = 2;     // hit max_tokens
  FINISH_REASON_ERROR = 3;      // backend error; message in `error`
}

message GenerateChunk {
  string text = 1;              // delta, not cumulative
  uint32 tokens = 2;            // number of tokens in this delta (usually 1)
  FinishReason finish_reason = 3; // set only on the final chunk
  Usage usage = 4;              // set only on the final chunk
  string error = 5;
}

message Usage {
  uint32 prompt_tokens = 1;
  uint32 completion_tokens = 2;
}

message EmbedRequest {
  string request_id = 1;
  string model = 2;
  repeated string inputs = 3;
}

message Embedding {
  repeated float values = 1;
}

message EmbedResponse {
  repeated Embedding embeddings = 1; // same order as inputs
  Usage usage = 2;
}

message LoadModelRequest  { string model = 1; }
message LoadModelResponse { uint64 size_bytes = 1; }

message UnloadModelRequest  { string model = 1; }
message UnloadModelResponse {}

message DrainRequest  {}
message DrainResponse { uint32 in_flight = 1; }
